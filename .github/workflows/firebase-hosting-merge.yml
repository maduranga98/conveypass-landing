name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
concurrency:
  group: deploy-live
  cancel-in-progress: false
permissions:
  contents: read
  checks: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          for f in public/index.html public/404.html public/styles.css; do
            test -s "$f" || { echo "Missing $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Deploy functions and Firestore rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDUSTRIAL_GLOW_295915 }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npm ci --prefix functions
          npx --yes firebase-tools@13 deploy --only functions,firestore:rules --project industrial-glow-295915 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDUSTRIAL_GLOW_295915 }}
          channelId: live
          projectId: industrial-glow-295915
