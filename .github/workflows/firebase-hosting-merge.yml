name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
concurrency:
  group: deploy-live
  cancel-in-progress: false
permissions:
  contents: read
  checks: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files
        run: |
          for f in public/index.html public/404.html public/styles.css; do
            test -s "$f" || { echo "Missing $f"; exit 1; }
          done
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INDUSTRIAL_GLOW_295915 }}
          channelId: live
          projectId: industrial-glow-295915
